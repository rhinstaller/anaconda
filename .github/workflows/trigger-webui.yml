# This workflow checks if the PR affects Anaconda (changes to pyanaconda folder),
# polls the packit COPR until it has the current PR version
# available, and then test-triggers an "anaconda PR" scenario.
#
# This workflow is inspired from:
# https://github.com/cockpit-project/cockpit/blob/main/.github/workflows/trigger-anaconda.yml
#
# Only the e2e ("expensive") scenario is triggered automatically. The other
# scenarios (bios, bootopts-net1, cockpit, dnf, other, storage) can be
# triggered manually with a PR comment from an organization member:
#
# /webui-test storage
# ... trigger the given scenario
#
# /webui-test storage cockpit
# ... trigger multiple scenarios (space separated)
#
# /webui-test all
# ... trigger all scenarios
#
# TEST ONLY - DO NOT MERGE - temporary commit for CI verification, to be deleted.

name: Anaconda Web UI
on:
  pull_request_target:
    # All file changes that might affect the Web UI
    paths:
      - 'pyanaconda/**'
      - '!pyanaconda/gui/**'
      - '!pyanaconda/tui/**'
      - '!po/**'
      - 'anaconda.py'
      - 'data/anaconda.conf'
      - 'data/conf.d/**/'
      - 'data/profile.d/**'
    branches: [ main, fedora-* ]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  define-matrix:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/webui-test'))
    uses: ./.github/workflows/define-matrix.yml
    with:
      target_branch: main  # Only run for releases that target main branch
      use_full_releases: true  # Keep full release names for container tags
      ignore_releases: fedora-eln

  trigger-webui:
    if: github.event_name == 'pull_request_target'
    needs: define-matrix
    runs-on: ubuntu-24.04
    # the default workflow token cannot read our org membership, for deciding who is allowed to trigger tests
    environment: gh-cockpituous
    # this polls for a COPR build, which can take long
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.releases) }}
    container: registry.fedoraproject.org/fedora:${{ matrix.distro_version }}

    steps:
      # Naively this should wait for github.event.pull_request.head.sha, but
      # that breaks on non-current branches, which packit merges to main with
      # an unpredictable SHA; so instead, wait until COPR has a build which is
      # newer than the PR push time. This assumes that this workflow always runs earlier
      # than the COPR srpm build finishes.

      - name: Install dependencies
        run: |
          dnf install -y git-core dnf-plugins-core gh

      - name: Wait for packit COPR build
        run: |
          set -ex
          PUSH_TIME=$(date --utc +%Y%m%d%H%M%S -d '${{ github.event.pull_request.head.repo.pushed_at }}')
          COPR_NAME="${{ github.event.pull_request.base.user.login }}-${{ github.event.pull_request.base.repo.name }}-${{ github.event.number }}"
          # Extract version number from release name (e.g., "fedora-43" -> "43", "fedora-rawhide" -> "rawhide")
          FEDORA_VERSION="${{ matrix.release }}"
          VERSION_ID=${FEDORA_VERSION#fedora-}
          for _ in $(seq 60); do
              sleep 60;
              if dnf copr enable -y packit/$COPR_NAME $FEDORA_VERSION-x86_64 &&
                 out=$(dnf info --refresh --repo='copr:*anaconda*' --releasever=$VERSION_ID anaconda) &&
                 stamp=$(echo "$out" | awk '/^Release/ { split($3, v, "."); print substr(v[2], 0, 14)}' | head -1) &&
                 [ "$stamp" -gt "$PUSH_TIME" ]; then
                  exit 0
              fi
          done
          exit 1

      - name: Trigger anaconda run
        id: trigger-anaconda-webui-automatic
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/cockpit-project/bots
          mkdir -p ~/.config/cockpit-dev
          echo '${{ secrets.GITHUB_TOKEN }}' > ~/.config/cockpit-dev/github-token

          PR_NUMBER="${{ github.event.number }}"
          REPO="${{ github.repository }}"
          TEST_OS="${{ matrix.release }}-boot"

          bots/tests-trigger --force --repo "$REPO" "$PR_NUMBER" \
            "$TEST_OS/expensive-anaconda-pr-$PR_NUMBER@rhinstaller/anaconda-webui" 2>&1 | tee trigger-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Send a PR comment that the bots/tests-trigger needs to be manually triggered
        env:
          GH_TOKEN: ${{ github.token }}
        if: "steps.trigger-anaconda-webui-automatic.outcome == 'failure'"
        run: |
          PR_NUMBER="${{ github.event.number }}"
          REPO="${{ github.repository }}"

          echo "Failed to automatically trigger the Web UI tests for this PR:" > comment.txt
          echo '```' >> comment.txt
          cat trigger-output.txt >> comment.txt
          echo '```' >> comment.txt
          echo "" >> comment.txt
          echo "If you have permission to trigger it yourself, comment \`/webui-test expensive\` to retry." >> comment.txt

          gh pr comment "$PR_NUMBER" --repo "$REPO" -F comment.txt

  pr-info:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/webui-test')
    runs-on: ubuntu-latest
    steps:
      - name: Parse requested scenarios
        id: parse
        # Do not use comment body directly in the shell command to avoid possible code injection.
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          ARGS=$(echo "$BODY" | sed -n '1 s/^[^ ]* *//p' | sed 's/[[:space:]]*$//')
          # Keep this list in sync with ANACONDA_SCENARIOS in cockpit-project/bots (lib/testmap.py).
          if [ "$ARGS" = "all" ]; then
            ARGS="bios bootopts-net1 cockpit dnf expensive other storage"
          fi
          echo "scenarios=$ARGS" >> $GITHUB_OUTPUT

    outputs:
      pr_number: ${{ github.event.issue.number }}
      scenarios: ${{ steps.parse.outputs.scenarios }}

  trigger-webui-manual:
    needs: [pr-info, define-matrix]
    if: github.event_name == 'issue_comment' && needs.pr-info.outputs.scenarios != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.releases) }}
    steps:
      - name: Trigger requested anaconda-webui scenarios
        id: trigger
        env:
          SCENARIOS: ${{ needs.pr-info.outputs.scenarios }}
        run: |
          git clone --depth=1 https://github.com/cockpit-project/bots
          mkdir -p ~/.config/cockpit-dev
          echo '${{ secrets.GITHUB_TOKEN }}' > ~/.config/cockpit-dev/github-token

          PR_NUMBER="${{ needs.pr-info.outputs.pr_number }}"
          REPO="${{ github.repository }}"
          TEST_OS="${{ matrix.release }}-boot"

          status=0
          for SCENARIO in $SCENARIOS; do
            bots/tests-trigger --force --repo "$REPO" "$PR_NUMBER" \
              "$TEST_OS/$SCENARIO-anaconda-pr-$PR_NUMBER@rhinstaller/anaconda-webui" 2>&1 | tee -a trigger-output.txt
            status=$((status + ${PIPESTATUS[0]}))
          done
          exit $status

      - name: Comment trigger failure on the PR
        if: failure() && steps.trigger.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ needs.pr-info.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          echo "Failed to trigger the requested Web UI test scenario(s) for ${{ matrix.release }}:" > comment.txt
          echo '```' >> comment.txt
          cat trigger-output.txt >> comment.txt
          echo '```' >> comment.txt

          gh pr comment "$PR_NUMBER" --repo "$REPO" -F comment.txt
